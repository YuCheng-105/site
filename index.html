<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外国语学院 考研参考专业筛选系统</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #1f2937;
      font-size: 14px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    .page-header {
      margin-bottom: 16px;
    }

    .page-header h1 {
      margin: 0 0 4px;
      font-size: 22px;
      color: #111827;
    }

    .page-header p {
      margin: 0;
      color: #6b7280;
      font-size: 13px;
    }

    /* 筛选面板 */
    .filter-panel {
      background: #ffffff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      margin-bottom: 16px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      align-items: end;
    }

    .filter-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* 关键词：跨整行 + 限宽居中 */
    .filter-keyword {
      grid-column: 1 / -1;
      justify-self: center;
      width: min(560px, 100%);
    }

    .filter-item label {
      font-size: 12px;
      color: #4b5563;
      font-weight: 600;
    }

    .filter-item select,
    .filter-item input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      background: #ffffff;
      color: #111827;
    }

    .filter-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
    }

    .btn {
      border: none;
      border-radius: 6px;
      padding: 6px 16px;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-default {
      background: #f3f4f6;
      color: #374151;
    }

    .btn-default:hover {
      background: #e5e7eb;
    }

    .result-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      color: #6b7280;
      font-size: 13px;
    }
    
    /* 新增：美化互斥开关的样式 */
    .switch-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      background: #e5e7eb;
      padding: 4px 10px;
      border-radius: 20px;
      transition: background 0.3s;
    }
    .switch-label input {
      cursor: pointer;
      margin: 0;
    }
    
    .region-section {
      margin-bottom: 20px;
    }

    .region-title {
      font-size: 16px;
      font-weight: bold;
      color: #1f2937;
      margin: 0 0 10px;
      padding-left: 8px;
      border-left: 3px solid #2563eb;
    }

    /* 默认：手机单列 */
    .major-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      align-items: start;
    }
    
    /* 平板及以上：双列 */
    @media (min-width: 769px) {
      .major-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* 大屏：三列，同时放宽容器 */
    @media (min-width: 1440px) {
      .container {
        max-width: 1440px;
      }
      .major-list {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    
    /* 卡片样式 */
    .major-card {
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
      border: 1px solid #e5e7eb;
      animation: fadeInSlide 0.3s ease-out;
    }

    @keyframes fadeInSlide {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }    
    
    .card-header {
      padding: 10px 12px;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .competition-low { background: linear-gradient(135deg, #86efac, #22c55e); }
    /* 修改为浅黄色 */
    .competition-medium { background: linear-gradient(135deg, hsl(37, 95%, 65%), hsl(37, 90%, 50%)); color: #ffffff;}
    .competition-high { background: linear-gradient(135deg, #fb923c, #ea580c); }
    .competition-extreme { background: linear-gradient(135deg, #f87171, #dc2626); }
    
    .header-left { flex: 1; min-width: 0; }

    .card-header h2 {
      margin: 0;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-header p {
      margin: 2px 0 0;
      font-size: 12px;
      opacity: 0.9;
    }

    /* 修改前：max-height: 0; overflow: hidden; padding: 0 12px; ... */
    .card-body {
      display: grid;
      grid-template-rows: 0fr; /* 默认高度为 0 */
      transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      background: #fafafa;
      border-top: 1px solid transparent;
    }

    /* 修改前：padding: 10px 12px 16px 12px; ... */
    .card-body.show {
      grid-template-rows: 1fr; /* 展开时自动撑开 */
      border-top: 1px solid #e5e7eb;
    }

    /* 新增：给内部内容加一个包裹层，用来处理 padding */
    .card-body-inner {
      overflow: hidden; /* 隐藏超出部分 */
      padding: 0 12px; /* 默认上下 padding 为 0 */
      transition: padding 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-body.show .card-body-inner {
      padding: 10px 12px 16px 12px; /* 展开时的 padding */
    }
    
    .toggle-btn {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      /* 核心：为箭头的旋转也加上丝滑过渡 */
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
      margin-left: 8px;
    }

    .toggle-btn.open { transform: rotate(180deg); }
    
    /* 手机端保持原来的 flex 换行 */
    .compact-data {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    /* 桌面端改成两列对齐 */
    @media (min-width: 769px) {
      .compact-data {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px 16px;
      }
    }

    .data-item { display: flex; align-items: center; gap: 4px; }
    .data-label { color: #6b7280; }
    .data-value { font-weight: 600; color: #111827; }
    .warning { color: #dc2626; }
    .success { color: #16a34a; }

    .notice {
      font-size: 12px;
      line-height: 1.5;
      color: #4b5563;
      background: #f3f4f6;
      padding: 6px 8px;
      border-radius: 4px;
      /* 核心修复：清除浏览器默认的外边距，防止被父元素 overflow:hidden 裁切 */
      margin: 0; 
    }

    .empty-state {
      display: none;
      text-align: center;
      padding: 40px;
      background: #ffffff;
      border-radius: 8px;
      color: #6b7280;
    }

    /* 筛选面板：平板竖屏（601~1023px）→ 2 列 */
    @media (max-width: 1023px) {
      .filter-grid { grid-template-columns: repeat(2, 1fr); }
    }
    
    /* 筛选面板：手机（≤600px）→ 1 列 */
    @media (max-width: 600px) {
      .filter-grid { grid-template-columns: 1fr; }
    }
    
    /* 专业卡片列表保持原有响应式行为 */
    @media (max-width: 768px) {
      .major-list { grid-template-columns: 1fr; }
    }
    
    /* === 需求1：筛选面板折叠相关 === */
    .filter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      cursor: pointer;
      user-select: none;
    }
    .filter-header h2 {
      margin: 0;
      font-size: 16px;
      color: #1f2937;
    }
    /* 复用你的 toggle-btn 样式，但改成适合白色背景的颜色 */
    .filter-toggle-btn {
      background: #f3f4f6;
      color: #4b5563;
    }
    .filter-toggle-btn.open { transform: rotate(180deg); }
    /* 控制筛选内容的平滑展开/收起 */
    .filter-body {
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 1000px; /* 给一个足够大的高度 */
    }
    .filter-body.collapsed {
      max-height: 0;
    }

    /* === 需求2：已选条件计数 === */
    .active-count-text {
      font-size: 13px;
      color: #6b7280;
      margin-right: 8px;
      display: flex;
      align-items: center;
    }

    /* === 需求3：筛选标签条 === */
    .active-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .filter-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #e0e7ff;
      color: #3730a3;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 12px;
      border: 1px solid #c7d2fe;
    }
      .filter-tag .close-btn {
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        color: #4f46e5;
        opacity: 0.6;
        transition: opacity 0.2s;
      }
      .filter-tag .close-btn:hover {
        opacity: 1;
      }
  </style>
</head>

          <div class="filter-item">

          </div>
        </div>
      </div>
      
      <div class="filter-actions">
        <span id="activeCountText" class="active-count-text">已选 0 个条件</span>
        <button class="btn btn-default" onclick="resetFilters()">重置</button>
      </div>
    </section>
    
    <div id="activeFilters" class="active-filters"></div>
    
    <div class="result-bar">

    window.onload = function() {
      filterMajors();
      // ✅ 新增：即时生效逻辑
      // 1. 监听所有下拉框（select）的变化
      document.querySelectorAll('.filter-grid select').forEach(select => {
        select.addEventListener('change', filterMajors);
      });
    
      // 2. 监听关键词输入框的输入（实时搜索）
      const keywordInput = document.getElementById('keyword');
      keywordInput.addEventListener('input', filterMajors);      
    };

    function filterMajors() {
      const region = document.getElementById('region').value;
      const degreeType = document.getElementById('degreeType').value;
      const foreignLang = document.getElementById('foreignLang').value;
      const protectFirst = document.getElementById('protectFirst').value;
      const subjectCategory = document.getElementById('subjectLevel').value;
      const competitionLevel = document.getElementById('competitionLevel').value;
      const mathExam = document.getElementById('mathExam').value;
      const keyword = document.getElementById('keyword').value.toLowerCase();
      const sortBy = document.getElementById('sortBy').value;

      let filteredMajors = majors.filter(major => {
        const regionMatch = !region || major.region === region;
        const degreeMatch = !degreeType || major.degreeType === degreeType;
        const foreignLangMatch = !foreignLang || major.foreignLang === foreignLang;
        const protectFirstMatch = !protectFirst || major.protectFirst === protectFirst;
        const subjectMatch = !subjectCategory || major.subjectCategory === subjectCategory;
        const competitionMatch = !competitionLevel || major.competitionLevel === competitionLevel;
        const mathMatch = !mathExam || major.mathExam === mathExam;
        
        const keywordMatch = !keyword || 
          major.school.toLowerCase().includes(keyword) || 
          major.majorName.toLowerCase().includes(keyword);

        return regionMatch && degreeMatch && foreignLangMatch && protectFirstMatch && 
               subjectMatch && competitionMatch && mathMatch && keywordMatch;
      });

      if (sortBy === 'ratioAsc') {
        filteredMajors.sort((a, b) => a.reportRatio - b.reportRatio);
      } else if (sortBy === 'ratioDesc') {
        filteredMajors.sort((a, b) => b.reportRatio - a.reportRatio);
      } else if (sortBy === 'scoreDesc') {
        filteredMajors.sort((a, b) => b.avgScore - a.avgScore);
      }

      renderMajors(filteredMajors);
      updateFilterUI();
    }

    function renderMajors(data) {
      const container = document.getElementById('resultContainer');
      const emptyState = document.getElementById('emptyState');
      const resultCount = document.getElementById('resultCount');

      // 更新结果数量
      resultCount.textContent = data.length;

      // 处理空状态显示
      if (data.length === 0) {
        emptyState.style.display = 'block';
        container.innerHTML = '';
        return;
      } else {
        emptyState.style.display = 'none';
      }

      // 按地域分组数据
      const groupedData = data.reduce((acc, major) => {
        if (!acc[major.region]) {
          acc[major.region] = [];
        }
        acc[major.region].push(major);
        return acc;
      }, {});

      // 渲染卡片
      let html = '';
      for (const region in groupedData) {
        // ✅ 获取当前地域下的专业数量
        const count = groupedData[region].length;
        
        html += `
          <section class="region-section">
            <h3 class="region-title">${region}（${count}）</h3>
            <div class="major-list">
        `;

        groupedData[region].forEach((major, index) => {
          // 生成唯一的ID用于展开/收起
          const cardId = `card-${region.replace(/\s+/g, '-')}-${index}`;
          
          // 根据竞争程度确定卡片头部样式类
          let competitionClass = '';
          switch(major.competitionLevel) {
            case '低': competitionClass = 'competition-low'; break;
            case '中': competitionClass = 'competition-medium'; break;
            case '高': competitionClass = 'competition-high'; break;
            case '极高': competitionClass = 'competition-extreme'; break;
            default: competitionClass = 'competition-medium';
          }

          html += `
            <div class="major-card">
              <div class="card-header ${competitionClass}" onclick="toggleCard('${cardId}')">
                <div class="header-left">
                  <h2>${major.school} - ${major.majorName}</h2>
                  <p>${major.college} | 代码: ${major.majorCode}</p>
                </div>
                <button class="toggle-btn" id="btn-${cardId}">▼</button>
              </div>
              <div class="card-body" id="${cardId}">
                <div class="card-body-inner">
                  <div class="compact-data">
                    <div class="data-item">
                      <span class="data-label">学位类型:</span>
                      <span class="data-value">${major.degreeType}</span>
                    </div>
                    <div class="data-item">
                      <span class="data-label">竞争程度:</span>
                      <span class="data-value">${major.competitionLevel}</span>
                    </div>
                    <div class="data-item">
                      <span class="data-label">报录比:</span>
                      <span class="data-value" style="color: ${
                        major.competitionLevel === '低' ? '#10b981' : 
                        major.competitionLevel === '中' ? '#f59e0b' : 
                        major.competitionLevel === '高' ? '#f97316' : '#ef4444'
                      }; font-weight: bold;">${major.reportRatio}:1</span>
                    </div>

                    <div class="data-item">
                      <span class="data-label">复试线:</span>
                      <span class="data-value">${major.recheckLine}</span>
                    </div>
                    <div class="data-item">
                      <span class="data-label">推免占比:</span>
                      <span class="data-value ${parseFloat(major.recommendRatio) > 20 ? 'warning' : 'success'}">${major.recommendRatio}</span>
                    </div>
                    <div class="data-item">
                      <span class="data-label">录取均分:</span>
                      <span class="data-value">${major.avgScore}</span>
                    </div>
                    <div class="data-item">
                      <span class="data-label">二外要求:</span>
                      <span class="data-value">${major.foreignLang}</span>
                    </div>
                    <div class="data-item">
                      <span class="data-label">考数学:</span>
                      <span class="data-value">${major.mathExam}</span>
                    </div>
                    <div class="data-item">
                      <span class="data-label">保护一志愿:</span>
                      <span class="data-value">${major.protectFirst}</span>
                    </div>
                    <div class="data-item">
                      <span class="data-label">学科评估:</span>
                      <span class="data-value">${major.subjectLevel}</span>
                    </div>
                  </div>
                  <div class="notice">
                    <strong>备考提示：</strong>${major.notice}
                  </div>
                </div>
              </div>
            </div>
          `;
        });

        html += `
            </div>
          </section>
        `;
      }

      container.innerHTML = html;
    }

    // 重置筛选条件
    function resetFilters() {
      document.getElementById('region').value = '';
      document.getElementById('degreeType').value = '';
      document.getElementById('competitionLevel').value = '';
      document.getElementById('foreignLang').value = '';
      document.getElementById('mathExam').value = '';
      document.getElementById('protectFirst').value = '';
      document.getElementById('subjectLevel').value = '';
      document.getElementById('keyword').value = '';
      document.getElementById('sortBy').value = 'default';
      filterMajors();
    }

    // 展开/收起卡片详情（支持互斥/非互斥切换）
    function toggleCard(cardId) {
      const currentCardBody = document.getElementById(cardId);
      const currentToggleBtn = document.getElementById(`btn-${cardId}`);
      const currentCard = currentCardBody.closest('.major-card');
      
      // 判断当前卡片在点击之前，是否已经处于展开状态
      const isCurrentlyOpen = currentCardBody.classList.contains('show');
      
      // 读取互斥开关状态
      const isAccordionMode = document.getElementById('accordionToggle').checked;
    
      // 核心：定义一个内部函数，用于平滑滚动到居中
      const scrollToCenter = () => {
        setTimeout(() => {
          currentCard.scrollIntoView({
            behavior: 'smooth',
            block: 'center'
          });
        }, 100);
      };
    
      if (isAccordionMode) {
        // 【模式一：互斥展开（手风琴）】
        // 1. 先把所有卡片强制收起
        document.querySelectorAll('.card-body').forEach(body => body.classList.remove('show'));
        document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('open'));
        
        // 2. 如果点击的卡片之前是收起的，那就展开它（如果之前是展开的，刚才已经被关掉了，就保持关闭状态）
        if (!isCurrentlyOpen) {
          currentCardBody.classList.add('show');
          currentToggleBtn.classList.add('open');
          scrollToCenter();
        }
      } else {
        // 【模式二：非互斥（自由开关）】
        // 不干涉其他卡片，只单独控制自己
        if (isCurrentlyOpen) {
          // 如果是打开的，就手动关上
          currentCardBody.classList.remove('show');
          currentToggleBtn.classList.remove('open');
        } else {
          // 如果是关着的，就手动打开
          currentCardBody.classList.add('show');
          currentToggleBtn.classList.add('open');
          scrollToCenter();
        }
      }
    }
    
    // 更新已选条件标签和数量
    function updateFilterUI() {
      // 映射表：把元素的 id 映射成用户看得懂的标签名
      const filterMap = {
        region: '地域',
        degreeType: '学位类型',
        competitionLevel: '竞争程度',
        protectFirst: '保护一志愿',
        foreignLang: '二外要求',
        mathExam: '考数学',
        subjectLevel: '学科评估',
        keyword: '关键词'
      };
      
      let count = 0;
      let tagsHtml = '';
      
      for (let key in filterMap) {
        const el = document.getElementById(key);
        const val = el.value.trim();
        if (val) {
          count++;
          tagsHtml += `<div class="filter-tag">
            ${filterMap[key]}: ${val} 
            <span class="close-btn" onclick="removeFilter('${key}')">×</span>
          </div>`;
        }
      }
      
      document.getElementById('activeCountText').textContent = `已选 ${count} 个条件`;
      document.getElementById('activeFilters').innerHTML = tagsHtml;
    }
    
    // 点击标签上的 × 取消该条件
    function removeFilter(key) {
      document.getElementById(key).value = '';
      filterMajors(); // 重新触发筛选，里面的 updateFilterUI 会自动更新UI
    }
    
    // 展开/收起筛选面板
    function toggleFilterPanel() {
      const body = document.getElementById('filterBody');
      const btn = document.getElementById('filterToggleBtn');
      
      body.classList.toggle('collapsed');
      btn.classList.toggle('open');
    }
  </script>
