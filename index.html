<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外国语学院考研专业列表</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .page-header {
      margin-bottom: 20px;
    }

    .page-header h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #111827;
    }

    .page-header p {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
    }

    .filter-panel {
      background: #ffffff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      margin-bottom: 24px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .filter-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-item label {
      font-size: 13px;
      color: #4b5563;
      font-weight: 600;
    }

    .filter-item select,
    .filter-item input {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      background: #ffffff;
      color: #111827;
    }

    .filter-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-default {
      background: #f3f4f6;
      color: #374151;
    }

    .btn-default:hover {
      background: #e5e7eb;
    }

    .result-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      color: #6b7280;
      font-size: 14px;
    }

    .major-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .major-card {
      background: #ffffff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .major-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.1);
    }

    .card-header {
      padding: 18px 20px;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: #ffffff;
    }

    .card-header h2 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    .card-header p {
      margin: 0;
      font-size: 13px;
      opacity: 0.9;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .tag {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .card-body {
      padding: 18px 20px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .info-item {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px;
    }

    .info-label {
      display: block;
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
    }

    .warning {
      color: #dc2626;
    }

    .success {
      color: #16a34a;
    }

    .notice {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.6;
      color: #1e3a8a;
    }

    .empty-state {
      display: none;
      text-align: center;
      padding: 40px;
      background: #ffffff;
      border-radius: 14px;
      color: #6b7280;
    }

    @media (max-width: 992px) {
      .filter-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .major-list {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 576px) {
      .container {
        padding: 14px;
      }

      .filter-grid {
        grid-template-columns: 1fr;
      }

      .filter-actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="page-header">
      <h1>外国语学院考研专业列表</h1>
      <p>支持按学位类型、二外要求、竞争程度、学科评估等条件筛选</p>
    </header>

    <section class="filter-panel">
      <div class="filter-grid">
        <div class="filter-item">
          <label for="degreeType">学位类型</label>
          <select id="degreeType">
            <option value="">全部</option>
            <option value="学术型硕士（学硕）">学术型硕士（学硕）</option>
            <option value="专业学位硕士（专硕）">专业学位硕士（专硕）</option>
          </select>
        </div>

        <div class="filter-item">
          <label for="foreignLang">二外要求</label>
          <select id="foreignLang">
            <option value="">全部</option>
            <option value="必考">必考</option>
            <option value="可选">可选</option>
            <option value="不考">不考</option>
            <option value="待核实">待核实</option>
          </select>
        </div>

        <div class="filter-item">
          <label for="protectFirst">是否保护一志愿</label>
          <select id="protectFirst">
            <option value="">全部</option>
            <option value="是">是</option>
            <option value="否">否</option>
            <option value="部分保护">部分保护</option>
            <option value="待核实">待核实</option>
          </select>
        </div>

        <div class="filter-item">
          <label for="subjectLevel">学科评估</label>
          <select id="subjectLevel">
            <option value="">全部</option>
            <option value="A类">A类</option>
            <option value="B类">B类</option>
            <option value="C类">C类</option>
            <option value="未公开">未公开/待更新</option>
          </select>
        </div>

        <div class="filter-item">
          <label for="competitionLevel">竞争程度</label>
          <select id="competitionLevel">
            <option value="">全部</option>
            <option value="低">低</option>
            <option value="中">中</option>
            <option value="高">高</option>
            <option value="极高">极高</option>
          </select>
        </div>

        <div class="filter-item">
          <label for="mathExam">是否考数学</label>
          <select id="mathExam">
            <option value="">全部</option>
            <option value="是">是</option>
            <option value="否">否</option>
          </select>
        </div>

        <div class="filter-item">
          <label for="keyword">院校/专业关键词</label>
          <input id="keyword" type="text" placeholder="如：英语笔译、某某大学">
        </div>

        <div class="filter-item">
          <label for="sortBy">排序方式</label>
          <select id="sortBy">
            <option value="default">默认排序</option>
            <option value="ratioAsc">报录比从低到高</option>
            <option value="ratioDesc">报录比从高到低</option>
            <option value="scoreDesc">录取平均分从高到低</option>
          </select>
        </div>
      </div>

      <div class="filter-actions">
        <button class="btn btn-primary" onclick="filterMajors()">筛选</button>
        <button class="btn btn-default" onclick="resetFilters()">重置</button>
      </div>
    </section>

    <div class="result-bar">
      <span>共找到 <strong id="resultCount">0</strong> 个专业</span>
      <span>数据年份：2026</span>
    </div>

    <main id="majorList" class="major-list"></main>
    <div id="emptyState" class="empty-state">暂无符合条件的专业，请调整筛选条件。</div>
  </div>

  <script>
    const majors = [
      {
        school: "某某大学",
        college: "外国语学院",
        majorName: "英语笔译",
        majorCode: "055101",
        degreeType: "专业学位硕士（专硕）",
        studyMode: "全日制",
        foreignLang: "不考",
        mathExam: "否",
        protectFirst: "是",
        subjectLevel: "B+",
        subjectCategory: "B类",
        reportRatio: 12.8,
        recheckRatio: 1.6,
        avgScore: 382,
        competitionLevel: "高",
        suitable: "翻译、本地化、语言服务",
        notice: "偏实践应用，适合希望从事翻译、本地化、语言服务方向的学生。"
      },
      {
        school: "某某师范大学",
        college: "外国语学院",
        majorName: "学科教学（英语）",
        majorCode: "045108",
        degreeType: "专业学位硕士（专硕）",
        studyMode: "全日制",
        foreignLang: "不考",
        mathExam: "否",
        protectFirst: "是",
        subjectLevel: "A-",
        subjectCategory: "A类",
        reportRatio: 15.2,
        recheckRatio: 1.4,
        avgScore: 390,
        competitionLevel: "极高",
        suitable: "中小学教师、英语教学",
        notice: "教师方向热门专业，建议关注教育综合和英语教学法准备。"
      },
      {
        school: "某某财经大学",
        college: "外国语学院",
        majorName: "国际商务",
        majorCode: "025400",
        degreeType: "专业学位硕士（专硕）",
        studyMode: "全日制",
        foreignLang: "不考",
        mathExam: "是",
        protectFirst: "部分保护",
        subjectLevel: "未公开",
        subjectCategory: "未公开",
        reportRatio: 8.6,
        recheckRatio: 1.3,
        avgScore: 372,
        competitionLevel: "中",
        suitable: "涉外商务、国际贸易、跨境电商",
        notice: "适合外语基础较好、愿意补充商科知识的学生。"
      },
      {
        school: "某某大学",
        college: "外国语学院",
        majorName: "外国语言学及应用语言学",
        majorCode: "050211",
        degreeType: "学术型硕士（学硕）",
        studyMode: "全日制",
        foreignLang: "必考",
        mathExam: "否",
        protectFirst: "待核实",
        subjectLevel: "A",
        subjectCategory: "A类",
        reportRatio: 9.4,
        recheckRatio: 1.5,
        avgScore: 376,
        competitionLevel: "高",
        suitable: "科研、读博、高校方向",
        notice: "偏理论研究，需重点准备语言学理论和研究方法。"
      }
    ];

    function renderMajors(list) {
      const majorList = document.getElementById("majorList");
      const emptyState = document.getElementById("emptyState");
      const resultCount = document.getElementById("resultCount");

      majorList.innerHTML = "";
      resultCount.textContent = list.length;

      if (list.length === 0) {
        emptyState.style.display = "block";
        return;
      }

      emptyState.style.display = "none";

      list.forEach(major => {
        const card = document.createElement("article");
        card.className = "major-card";
        card.innerHTML = `
          <header class="card-header">
            <h2>${major.majorName}</h2>
            <p>${major.school} · ${major.college} · 专业代码：${major.majorCode}</p>
            <div class="tag-list">
              <span class="tag">${major.degreeType}</span>
              <span class="tag">${major.studyMode}</span>
              <span class="tag">二外：${major.foreignLang}</span>
            </div>
          </header>
          <div class="card-body">
            <div class="info-grid">
              <div class="info-item">
                <span class="info-label">统考报录比</span>
                <span class="info-value warning">${major.reportRatio}:1</span>
              </div>
              <div class="info-item">
                <span class="info-label">复录比</span>
                <span class="info-value">${major.recheckRatio}:1</span>
              </div>
              <div class="info-item">
                <span class="info-label">录取平均分</span>
                <span class="info-value">${major.avgScore}分</span>
              </div>
              <div class="info-item">
                <span class="info-label">学科评估</span>
                <span class="info-value">${major.subjectLevel}</span>
              </div>
              <div class="info-item">
                <span class="info-label">是否考数学</span>
                <span class="info-value">${major.mathExam}</span>
              </div>
              <div class="info-item">
                <span class="info-label">保护一志愿</span>
                <span class="info-value success">${major.protectFirst}</span>
              </div>
            </div>
            <div class="notice">
              <strong>适合方向：</strong>${major.suitable}<br>
              <strong>报考提示：</strong>${major.notice}
            </div>
          </div>
        `;
        majorList.appendChild(card);
      });
    }

    function filterMajors() {
      const degreeType = document.getElementById("degreeType").value;
      const foreignLang = document.getElementById("foreignLang").value;
      const protectFirst = document.getElementById("protectFirst").value;
      const subjectCategory = document.getElementById("subjectLevel").value;
      const competitionLevel = document.getElementById("competitionLevel").value;
      const mathExam = document.getElementById("mathExam").value;
      const keyword = document.getElementById("keyword").value.trim().toLowerCase();
      const sortBy = document.getElementById("sortBy").value;

      let filtered = majors.filter(major => {
        return (!degreeType || major.degreeType === degreeType)
          && (!foreignLang || major.foreignLang === foreignLang)
          && (!protectFirst || major.protectFirst === protectFirst)
          && (!subjectCategory || major.subjectCategory === subjectCategory)
          && (!competitionLevel || major.competitionLevel === competitionLevel)
          && (!mathExam || major.mathExam === mathExam)
          && (!keyword
            || major.school.toLowerCase().includes(keyword)
            || major.majorName.toLowerCase().includes(keyword)
            || major.majorCode.includes(keyword));
      });

      if (sortBy === "ratioAsc") {
        filtered.sort((a, b) => a.reportRatio - b.reportRatio);
      } else if (sortBy === "ratioDesc") {
        filtered.sort((a, b) => b.reportRatio - a.reportRatio);
      } else if (sortBy === "scoreDesc") {
        filtered.sort((a, b) => b.avgScore - a.avgScore);
      }

      renderMajors(filtered);
    }

    function resetFilters() {
      document.getElementById("degreeType").value = "";
      document.getElementById("foreignLang").value = "";
      document.getElementById("protectFirst").value = "";
      document.getElementById("subjectLevel").value = "";
      document.getElementById("competitionLevel").value = "";
      document.getElementById("mathExam").value = "";
      document.getElementById("keyword").value = "";
      document.getElementById("sortBy").value = "default";
      renderMajors(majors);
    }

    renderMajors(majors);
  </script>
</body>
</html>
