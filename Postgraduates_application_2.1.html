<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>外国语学院 考研参考专业筛选系统</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #1f2937;
      font-size: 14px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    .page-header {
      margin-bottom: 16px;
    }

    .page-header h1 {
      margin: 0 0 4px;
      font-size: 22px;
      color: #111827;
    }

    .page-header p {
      margin: 0;
      color: #6b7280;
      font-size: 13px;
    }

    /* 筛选面板 */
    .filter-panel {
      background: #ffffff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      margin-bottom: 16px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      align-items: end;
    }

    .filter-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .col-span-6 { grid-column: span 6; }
    .col-span-3 { grid-column: span 3; }
    .col-span-2 { grid-column: span 2; }

    .filter-item label {
      font-size: 12px;
      color: #4b5563;
      font-weight: 600;
    }

    .filter-item select,
    .filter-item input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      background: #ffffff;
      color: #111827;
    }

    /* 筛选按钮容器 */
    .filter-actions {
      display: flex;
      gap: 10px; /* 两个按钮之间的间距 */
      justify-content: flex-end; /* 让按钮靠右对齐，和输入框底部对齐更美观 */
      padding-bottom: 2px; /* 微调：让按钮和左侧输入框视觉底部完全对齐 */
    }


    .btn {
      border: none;
      border-radius: 6px;
      padding: 6px 16px;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-default {
      background: #f3f4f6;
      color: #374151;
    }

    .btn-default:hover {
      background: #e5e7eb;
    }

    .result-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      color: #6b7280;
      font-size: 13px;
    }

    .region-section {
      margin-bottom: 20px;
    }

    .region-title {
      font-size: 16px;
      font-weight: bold;
      color: #1f2937;
      margin: 0 0 10px;
      padding-left: 8px;
      border-left: 3px solid #2563eb;
    }

    .major-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    /* 卡片样式 */
    .major-card {
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
      border: 1px solid #e5e7eb;
    }

    .card-header {
      padding: 10px 12px;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .competition-low { background: linear-gradient(135deg, #86efac, #22c55e); }
    /* 修改为浅黄色 */
    .competition-medium { background: linear-gradient(135deg, hsl(37, 95%, 65%), hsl(37, 90%, 50%)); color: #ffffff;}
    .competition-high { background: linear-gradient(135deg, #fb923c, #ea580c); }
    .competition-extreme { background: linear-gradient(135deg, #f87171, #dc2626); }
    
    .header-left { flex: 1; min-width: 0; }

    .card-header h2 {
      margin: 0;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-header p {
      margin: 2px 0 0;
      font-size: 12px;
      opacity: 0.9;
    }

    /* 修改前：max-height: 0; overflow: hidden; padding: 0 12px; ... */
    .card-body {
      display: grid;
      grid-template-rows: 0fr; /* 默认高度为 0 */
      transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      background: #fafafa;
      border-top: 1px solid transparent;
    }

    /* 修改前：padding: 10px 12px 16px 12px; ... */
    .card-body.show {
      grid-template-rows: 1fr; /* 展开时自动撑开 */
      border-top: 1px solid #e5e7eb;
    }

    /* 新增：给内部内容加一个包裹层，用来处理 padding */
    .card-body-inner {
      overflow: hidden; /* 隐藏超出部分 */
      padding: 0 12px; /* 默认上下 padding 为 0 */
      transition: padding 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-body.show .card-body-inner {
      padding: 10px 12px 16px 12px; /* 展开时的 padding */
    }
    
    .toggle-btn {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      /* 核心：为箭头的旋转也加上丝滑过渡 */
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
      margin-left: 8px;
    }

    .toggle-btn.open { transform: rotate(180deg); }
    
    .compact-data {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .data-item { display: flex; align-items: center; gap: 4px; }
    .data-label { color: #6b7280; }
    .data-value { font-weight: 600; color: #111827; }
    .warning { color: #dc2626; }
    .success { color: #16a34a; }

    .notice {
      font-size: 12px;
      line-height: 1.5;
      color: #4b5563;
      background: #f3f4f6;
      padding: 6px 8px;
      border-radius: 4px;
      /* 核心修复：清除浏览器默认的外边距，防止被父元素 overflow:hidden 裁切 */
      margin: 0; 
    }

    .empty-state {
      display: none;
      text-align: center;
      padding: 40px;
      background: #ffffff;
      border-radius: 8px;
      color: #6b7280;
    }

    @media (max-width: 768px) {
      .filter-grid { grid-template-columns: 1fr; }
      .col-span-6, .col-span-3, .col-span-2 { grid-column: span 1; }
      .major-list { grid-template-columns: 1fr; }
    }
  </style>
